<!DOCTYPE html>
<html lang="es">
<head>
    <script src="assets/js/session-security.js?v=20261006"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>Confirmar cuenta | Kore Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light" data-access-page="activation">
  <main class="container py-5" style="max-width:640px">
    <a href="login.html" class="text-decoration-none">KORE.inventory</a>
    <h1 class="h3 mt-4">Confirmar cuenta</h1>
    <p id="accountEmail" class="text-muted"></p><div id="accessStatus" role="status"></div>
    <form id="activationForm" class="d-none">
      <div class="mb-3"><label class="form-label" for="accessCode">C&oacute;digo recibido por correo</label><input id="accessCode" class="form-control" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
      <button type="button" id="resendCode" class="btn btn-outline-secondary mb-3"><i class="bi bi-send me-2"></i>Enviar otro c&oacute;digo</button>
      <div class="mb-3"><label class="form-label" for="newPassword">Nueva contrase&ntilde;a</label><input id="newPassword" type="password" class="form-control" minlength="15" maxlength="72" autocomplete="new-password" required></div>
      <div class="mb-3"><label class="form-label" for="confirmPassword">Confirmar contrase&ntilde;a</label><input id="confirmPassword" type="password" class="form-control" autocomplete="new-password" required></div>
      <div class="mb-3"><label class="form-label" for="activationMfa">C&oacute;digo del autenticador o de respaldo (si MFA est&aacute; activo)</label><input id="activationMfa" class="form-control" pattern="[0-9]{6}|[a-f0-9]{16}" maxlength="16" autocomplete="one-time-code"></div>
      <div id="legalChecks" class="border-top pt-3 mb-4"></div>
      <button class="btn btn-primary" type="submit"><i class="bi bi-check-circle me-2"></i>Confirmar cuenta</button>
    </form>
  </main><script src="assets/js/access-account.js?v=20261006-documentos"></script>
</body></html>
