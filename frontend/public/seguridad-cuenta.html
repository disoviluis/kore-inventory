<!DOCTYPE html>
<html lang="es">
<head>
    <script src="assets/js/session-security.js?v=20261006"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguridad de cuenta | Kore Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light" data-access-page="security">
  <main class="container py-4" style="max-width:760px">
    <nav class="d-flex justify-content-between gap-3"><a href="dashboard.html">KORE.inventory</a><a href="login.html" id="securityLogout">Cerrar sesi&oacute;n</a></nav>
    <h1 class="h3 mt-4">Seguridad de cuenta</h1>
    <p id="accountEmail" class="text-muted"></p><div id="accessStatus" role="status"></div>
    <section class="border-top py-4"><h2 class="h5">Documentos legales</h2>
      <form id="acceptLegalForm"><div id="legalChecks"></div><button class="btn btn-primary mt-3"><i class="bi bi-check2 me-2"></i>Aceptar documentos</button></form>
    </section>
    <section class="border-top py-4"><h2 class="h5">Autenticaci&oacute;n de dos factores</h2>
      <p id="mfaState"></p>
      <form id="prepareMfaForm"><label for="mfaPassword" class="form-label">Contrase&ntilde;a actual</label><input type="password" id="mfaPassword" class="form-control mb-3" autocomplete="current-password" required><button class="btn btn-outline-primary"><i class="bi bi-shield-lock me-2"></i>Preparar autenticador</button></form>
      <form id="confirmMfaForm" class="d-none mt-3"><img id="mfaQr" width="220" height="220" alt="QR para configurar autenticador"><p><code id="mfaManualSecret" style="overflow-wrap:anywhere"></code></p><label for="mfaCode" class="form-label">C&oacute;digo del autenticador</label><input id="mfaCode" class="form-control mb-3" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required><button class="btn btn-primary"><i class="bi bi-check-circle me-2"></i>Activar MFA</button></form>
      <div id="mfaBackup" class="d-none mt-4"><h3 class="h6">C&oacute;digos de respaldo de un solo uso</h3><pre id="mfaBackupCodes"></pre><button id="downloadMfaBackup" class="btn btn-outline-primary"><i class="bi bi-download me-2"></i>Descargar c&oacute;digos</button><a href="login.html" class="btn btn-primary ms-2">Iniciar sesi&oacute;n</a></div>
      <form id="resetMfaForm" class="d-none mt-3"><label for="resetMfaPassword" class="form-label">Contrase&ntilde;a actual</label><input id="resetMfaPassword" type="password" class="form-control mb-3" autocomplete="current-password" required><label for="resetMfaCode" class="form-label">C&oacute;digo del autenticador o de respaldo</label><input id="resetMfaCode" class="form-control mb-3" pattern="[0-9]{6}|[a-f0-9]{16}" maxlength="16" required><button class="btn btn-outline-danger"><i class="bi bi-arrow-repeat me-2"></i>Cambiar autenticador</button></form>
    </section>
    <section class="border-top py-4 d-flex gap-3 flex-wrap"><a id="securityContinue" class="btn btn-primary" href="dashboard.html">Continuar</a><button id="revokeSessions" class="btn btn-outline-danger"><i class="bi bi-box-arrow-right me-2"></i>Cerrar todas las sesiones</button></section>
  </main><script src="assets/js/access-account.js?v=20261006"></script>
</body></html>
